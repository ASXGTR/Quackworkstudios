<!-- ENGINE & SUPABASE SYNC SCRIPT -->
  <script>
    // ============================================================
    // 1. SUPABASE CLIENT INITIALIZATION
    // ============================================================
    const SUPABASE_URL = "https://ryhiswzhfivvagxztqqc.supabase.co";
    const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5aGlzd3poZml2dmFneHp0dHFjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njk3MDIzNzUsImV4cCI6MjA4NTI3ODM3NX0.SHSVZ4GE_Eh_2CpqwNIXdOFz5_x7uapSU3ICM8HCqXk";

    let supabase = null;
    try {
      if (window.supabase && typeof window.supabase.createClient === "function") {
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      } else {
        console.warn("Supabase CDN not loaded.");
      }
    } catch (e) {
      console.warn("Supabase init error:", e);
    }

    // ============================================================
    // 2. GAME ENGINE
    // ============================================================
    const DEFAULT_GALLERY = [
      {
        id: "doodle-1",
        name: "PUGGY",
        prompt: "A wrinkly Pug wearing retro sunglasses 😎",
        likes: 0,
        superLikes: 0,
        img: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480' viewBox='0 0 480 480'><rect width='480' height='480' fill='%23ffffff'/><circle cx='240' cy='240' r='105' fill='%23b45309' stroke='%23000' stroke-width='6'/><ellipse cx='240' cy='285' rx='48' ry='32' fill='%23451a03' stroke='%23000' stroke-width='4'/><rect x='165' y='200' width='65' height='38' rx='8' fill='%23000'/><rect x='250' y='200' width='65' height='38' rx='8' fill='%23000'/><line x1='230' y1='216' x2='250' y2='216' stroke='%23000' stroke-width='6'/><polygon points='140,175 125,115 180,155' fill='%2378350f' stroke='%23000' stroke-width='4'/><polygon points='340,175 355,115 300,155' fill='%2378350f' stroke='%23000' stroke-width='4'/></svg>"
      },
      {
        id: "doodle-2",
        name: "CHOPPER",
        prompt: "A dog caught stealing a slice of pizza 🍕",
        likes: 0,
        superLikes: 0,
        img: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480' viewBox='0 0 480 480'><rect width='480' height='480' fill='%23ffffff'/><ellipse cx='190' cy='260' rx='85' ry='55' fill='%23f59e0b' stroke='%23000' stroke-width='6'/><circle cx='130' cy='210' r='45' fill='%23f59e0b' stroke='%23000' stroke-width='6'/><circle cx='120' cy='200' r='6' fill='%23000'/><polygon points='145,225 300,265 290,170' fill='%23fef08a' stroke='%23b45309' stroke-width='6'/><circle cx='215' cy='225' r='10' fill='%23ef4444'/><circle cx='255' cy='235' r='10' fill='%23ef4444'/></svg>"
      },
      {
        id: "doodle-3",
        name: "BARKY",
        prompt: "A dog wearing a Santa hat at Christmas 🎅",
        likes: 0,
        superLikes: 0,
        img: "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='480' height='480' viewBox='0 0 480 480'><rect width='480' height='480' fill='%23ffffff'/><ellipse cx='240' cy='275' rx='85' ry='75' fill='%23fef08a' stroke='%23000' stroke-width='6'/><circle cx='210' cy='255' r='8' fill='%23000'/><circle cx='270' cy='255' r='8' fill='%23000'/><ellipse cx='240' cy='295' rx='14' ry='10' fill='%23000'/><polygon points='165,210 240,85 315,210' fill='%23ef4444' stroke='%23000' stroke-width='5'/><rect x='155' y='200' width='170' height='26' rx='13' fill='%23ffffff' stroke='%23000' stroke-width='4'/><circle cx='240' cy='75' r='20' fill='%23ffffff' stroke='%23000' stroke-width='4'/></svg>"
      }
    ];

    const PROMPTS = [
      "A dog and a duck playing on the beach 🏖️🦆",
      "A dog doctor checking a heartbeat with a stethoscope 🩺🐕",
      "A dog driving a fast sports car with sunglasses 🏎️",
      "A dog camping by a campfire roasting marshmallows 🏕️🔥",
      "A dog playing cards with a poker face around a table 🃏♠️",
      "A dog skydiving with a parachute in mid-air 🪂",
      "A dog chef cooking spaghetti in a chaotic kitchen 🍝👨‍🍳",
      "A dog detective inspecting clues with a magnifying glass 🔍🕵️",
      "A dog DJ rocking big headphones at a dance party 🎧🎶",
      "An astronaut dog floating in outer space 🚀",
      "A dog wearing a Santa hat at Christmas 🎅",
      "A dog celebrating its birthday with a giant cake 🎂",
      "A dog dressed as a spooky Halloween ghost 👻",
      "A dog surfing a big ocean wave 🏄‍♂️",
      "A dog caught red-handed stealing a slice of pizza 🍕",
      "A wrinkly Pug wearing retro sunglasses 😎",
      "A fluffy Corgi with stubby legs chasing a tennis ball 🎾",
      "A long Dachshund (Wiener Dog) wearing a sweater 🌭",
      "A majestic Husky howling at the moon 🌕",
      "A fancy Poodle with a stylish fluffy haircut 🐩",
      "A dog dramatically refusing to take a bath in the tub 🛁",
      "A puppy having intense mud zoomies in the rain 🌧️"
    ];

    let currentPrompt = "";
    let isDrawing = false;
    let currentColor = "#000000";
    let brushSize = 7;
    let currentTool = "pen";

    let timeLeft = 90;
    let timerInterval = null;
    let isRoundActive = false;
    let undoStack = [];
    let gallery = [...DEFAULT_GALLERY];

    const canvas = document.getElementById("drawCanvas");
    const ctx = canvas.getContext("2d");
    const targetBreedEl = document.getElementById("targetBreed");
    const timerDisplay = document.getElementById("timerDisplay");
    const overlay = document.getElementById("overlay");

    const penToolBtn = document.getElementById("penToolBtn");
    const sprayToolBtn = document.getElementById("sprayToolBtn");
    const eraserToolBtn = document.getElementById("eraserToolBtn");
    const undoBtn = document.getElementById("undoBtn");
    const clearBtn = document.getElementById("clearBtn");
    const resetTimerBtn = document.getElementById("resetTimerBtn");
    const skipBtn = document.getElementById("skipBtn");
    const publishBtn = document.getElementById("publishBtn");
    const overlayRetryBtn = document.getElementById("overlayRetryBtn");
    const overlayUploadBtn = document.getElementById("overlayUploadBtn");

    const galleryGrid = document.getElementById("galleryGrid");
    const galleryCount = document.getElementById("galleryCount");
    const leaderboardBody = document.getElementById("leaderboardBody");

    const uploadModal = document.getElementById("uploadModal");
    const usernameInput = document.getElementById("usernameInput");
    const cancelModalBtn = document.getElementById("cancelModalBtn");
    const confirmUploadBtn = document.getElementById("confirmUploadBtn");

    function saveState() {
      undoStack.push(ctx.getImageData(0, 0, canvas.width, canvas.height));
      if (undoStack.length > 15) undoStack.shift();
    }

    function clearCanvas() {
      saveState();
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
    }
    clearCanvas();

    function startTimer() {
      clearInterval(timerInterval);
      timeLeft = 90;
      timerDisplay.textContent = `${timeLeft}s`;
      timerDisplay.classList.remove("warning");
      isRoundActive = true;

      timerInterval = setInterval(() => {
        timeLeft--;
        timerDisplay.textContent = `${timeLeft}s`;

        if (timeLeft <= 15) {
          timerDisplay.classList.add("warning");
        }

        if (timeLeft <= 0) {
          clearInterval(timerInterval);
          isRoundActive = false;
          overlay.style.display = "flex";
        }
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
      isRoundActive = false;
    }

    function getCoords(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;
      return {
        x: (clientX - rect.left) * scaleX,
        y: (clientY - rect.top) * scaleY
      };
    }

    function drawSpray(x, y) {
      const density = brushSize * 3;
      const radius = brushSize * 2.2;
      ctx.fillStyle = currentTool === "eraser" ? "#ffffff" : currentColor;

      for (let i = 0; i < density; i++) {
        const offsetX = (Math.random() - 0.5) * 2 * radius;
        const offsetY = (Math.random() - 0.5) * 2 * radius;
        if (offsetX * offsetX + offsetY * offsetY <= radius * radius) {
          ctx.fillRect(x + offsetX, y + offsetY, 1.5, 1.5);
        }
      }
    }

    function startDraw(e) {
      if (!isRoundActive) return;
      e.preventDefault();
      saveState();
      isDrawing = true;
      const { x, y } = getCoords(e);

      if (currentTool === "spray") {
        drawSpray(x, y);
      } else {
        ctx.beginPath();
        ctx.moveTo(x, y);
      }
    }

    function draw(e) {
      if (!isDrawing || !isRoundActive) return;
      e.preventDefault();
      const { x, y } = getCoords(e);

      if (currentTool === "spray") {
        drawSpray(x, y);
      } else {
        ctx.lineTo(x, y);
        ctx.strokeStyle = currentTool === "eraser" ? "#ffffff" : currentColor;
        ctx.lineWidth = currentTool === "eraser" ? brushSize * 3 : brushSize;
        ctx.lineCap = "round";
        ctx.lineJoin = "round";
        ctx.stroke();
      }
    }

    function stopDraw() {
      isDrawing = false;
    }

    canvas.addEventListener("mousedown", startDraw);
    canvas.addEventListener("mousemove", draw);
    canvas.addEventListener("mouseup", stopDraw);
    canvas.addEventListener("mouseleave", stopDraw);

    canvas.addEventListener("touchstart", startDraw, { passive: false });
    canvas.addEventListener("touchmove", draw, { passive: false });
    canvas.addEventListener("touchend", stopDraw);

    document.querySelectorAll(".color-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".color-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentColor = btn.dataset.color;
        if (currentTool === "eraser") {
          currentTool = "pen";
          penToolBtn.classList.add("active");
          eraserToolBtn.classList.remove("active");
        }
      });
    });

    penToolBtn.addEventListener("click", () => {
      currentTool = "pen";
      penToolBtn.classList.add("active");
      sprayToolBtn.classList.remove("active");
      eraserToolBtn.classList.remove("active");
    });

    sprayToolBtn.addEventListener("click", () => {
      currentTool = "spray";
      sprayToolBtn.classList.add("active");
      penToolBtn.classList.remove("active");
      eraserToolBtn.classList.remove("active");
    });

    eraserToolBtn.addEventListener("click", () => {
      currentTool = "eraser";
      eraserToolBtn.classList.add("active");
      penToolBtn.classList.remove("active");
      sprayToolBtn.classList.remove("active");
    });

    document.querySelectorAll(".size-btn").forEach(btn => {
      btn.addEventListener("click", () => {
        document.querySelectorAll(".size-btn").forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        brushSize = parseInt(btn.dataset.size);
      });
    });

    undoBtn.addEventListener("click", () => {
      if (undoStack.length > 0) {
        const lastState = undoStack.pop();
        ctx.putImageData(lastState, 0, 0);
      }
    });

    clearBtn.addEventListener("click", clearCanvas);

    resetTimerBtn.addEventListener("click", () => {
      overlay.style.display = "none";
      clearCanvas();
      undoStack = [];
      startTimer();
    });

    function nextPrompt() {
      stopTimer();
      overlay.style.display = "none";
      clearCanvas();
      undoStack = [];

      currentPrompt = PROMPTS[Math.floor(Math.random() * PROMPTS.length)];
      targetBreedEl.textContent = currentPrompt;
      startTimer();
    }

    skipBtn.addEventListener("click", nextPrompt);
    overlayRetryBtn.addEventListener("click", nextPrompt);

    function openUploadModal() {
      stopTimer();
      usernameInput.value = localStorage.getItem("doggame_username") || "BARKUS";
      uploadModal.style.display = "flex";
    }

    publishBtn.addEventListener("click", openUploadModal);
    overlayUploadBtn.addEventListener("click", () => {
      overlay.style.display = "none";
      openUploadModal();
    });
    cancelModalBtn.addEventListener("click", () => uploadModal.style.display = "none");

    // ============================================================
    // 3. SUPABASE DATA SYNC
    // ============================================================
    async function loadGallery() {
      if (!supabase) {
        renderGalleryAndLeaderboard();
        return;
      }

      try {
        const { data, error } = await supabase
          .from("bark_gallery")
          .select("*")
          .order("created_at", { ascending: false });

        if (error) throw error;

        if (data && data.length > 0) {
          gallery = data.map(row => ({
            id: String(row.id),
            name: row.dog_tag,
            prompt: row.prompt,
            likes: row.likes || 0,
            superLikes: row.super_likes || 0,
            img: row.image_data
          }));
        }

        renderGalleryAndLeaderboard();
      } catch (err) {
        console.warn("Supabase fetch fallback:", err);
        renderGalleryAndLeaderboard();
      }
    }

    confirmUploadBtn.addEventListener("click", async () => {
      let cleanName = usernameInput.value.trim().toUpperCase().replace(/[^A-Z0-9_]/g, "");
      if (cleanName.length < 3) cleanName = "DOGE";
      cleanName = cleanName.slice(0, 8);
      localStorage.setItem("doggame_username", cleanName);

      const dataUrl = canvas.toDataURL("image/jpeg", 0.6);
      uploadModal.style.display = "none";

      const tempId = "temp-" + Date.now();
      gallery.unshift({
        id: tempId,
        name: cleanName,
        prompt: currentPrompt,
        likes: 0,
        superLikes: 0,
        img: dataUrl
      });
      renderGalleryAndLeaderboard();

      if (supabase) {
        try {
          const { data, error } = await supabase
            .from("bark_gallery")
            .insert([{
              dog_tag: cleanName,
              prompt: currentPrompt,
              image_data: dataUrl,
              likes: 0,
              super_likes: 0
            }])
            .select();

          if (error) throw error;

          if (data && data[0]) {
            const real = data[0];
            gallery = gallery.map(item =>
              item.id === tempId
                ? {
                    id: String(real.id),
                    name: real.dog_tag,
                    prompt: real.prompt,
                    likes: real.likes || 0,
                    superLikes: real.super_likes || 0,
                    img: real.image_data
                  }
                : item
            );
            renderGalleryAndLeaderboard();
          }
        } catch (err) {
          console.error("Upload error:", err);
        }
      }

      nextPrompt();
      document.querySelector(".gallery-section").scrollIntoView({ behavior: "smooth" });
    });

    window.vote = async function(id, type) {
      const idStr = String(id);
      const item = gallery.find(g => String(g.id) === idStr);
      if (!item) return;

      if (type === "like") item.likes += 1;
      else if (type === "super") item.superLikes += 1;

      renderGalleryAndLeaderboard();

      if (supabase && !idStr.startsWith("doodle-") && !idStr.startsWith("temp-")) {
        try {
          await supabase
            .from("bark_gallery")
            .update({
              likes: item.likes,
              super_likes: item.superLikes
            })
            .eq("id", id);
        } catch (err) {
          console.error("Vote sync error:", err);
        }
      }
    };

    function calculateScore(item) {
      return (item.likes * 1) + (item.superLikes * 3);
    }

    function renderGalleryAndLeaderboard() {
      galleryCount.textContent = `${gallery.length} ARTWORKS`;

      galleryGrid.innerHTML = gallery.map(item => `
        <div class="gallery-card">
          <div class="gallery-img-wrap">
            <img src="${item.img}" alt="${item.prompt}" />
          </div>
          <div class="gallery-info">
            <div class="gallery-user-row">
              <span class="gallery-user">${item.name}</span>
              <span style="font-size: 0.75rem; color: #10b981; font-weight: bold;">
                ${calculateScore(item)} PTS
              </span>
            </div>
            <div class="gallery-prompt" title="${item.prompt}">${item.prompt}</div>
            <div class="vote-bar">
              <button class="vote-btn" onclick="vote('${item.id}', 'like')" title="Give a Like (+1 pt)">
                ❤️ <span>${item.likes}</span>
              </button>
              <button class="vote-btn" style="border-color: #f59e0b;" onclick="vote('${item.id}', 'super')" title="Super Like with a Bone! (+3 pts)">
                🦴 <span>${item.superLikes}</span>
              </button>
            </div>
          </div>
        </div>
      `).join("");

      const sorted = [...gallery].sort((a, b) => calculateScore(b) - calculateScore(a));

      leaderboardBody.innerHTML = sorted.slice(0, 10).map((item, idx) => `
        <tr>
          <td style="color: ${idx === 0 ? '#fcd34d' : idx === 1 ? '#cbd5e1' : idx === 2 ? '#b45309' : '#8f9ba8'}; font-weight: bold;">
            ${idx + 1}.
          </td>
          <td class="tag-highlight">${item.name}</td>
          <td class="score-highlight">${calculateScore(item)} PTS</td>
        </tr>
      `).join("");
    }

    // ============================================================
    // 4. INITIALIZATION & REALTIME
    // ============================================================
    async function initSupabaseSync() {
      renderGalleryAndLeaderboard();
      nextPrompt();

      if (!supabase) {
        console.warn("Supabase not available — running in local-only mode.");
        return;
      }

      try {
        supabase
          .channel("public:bark_gallery")
          .on(
            "postgres_changes",
            { event: "*", schema: "public", table: "bark_gallery" },
            () => loadGallery()
          )
          .subscribe();
      } catch (err) {
        console.warn("Realtime subscription error:", err);
      }

      await loadGallery();
    }

    initSupabaseSync();
  </script>
