<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Verification Successful – Quackwork Studios</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            background: #0A0C10;
            color: #fff;
            font-family: Arial, Helvetica, sans-serif;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            min-height: 100vh;
        }

        .logo {
            max-width: 220px;
            width: 80%;
            height: auto;
            margin-bottom: 30px;
        }

        .game-title {
            max-width: 420px;
            width: 90%;
            height: auto;
            margin-top: 35px;
            border-radius: 12px;
        }

        .badge {
            background: rgba(16, 185, 129, 0.15);
            border: 1px solid rgba(16, 185, 129, 0.4);
            color: #34D399;
            font-weight: bold;
            font-size: 14px;
            padding: 6px 16px;
            border-radius: 9999px;
            margin-bottom: 16px;
            display: inline-block;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        h1 {
            font-size: 36px;
            margin: 0 0 12px 0;
            color: #ffffff;
        }

        p {
            font-size: 18px;
            color: #cbd5e1;
            margin: 0 0 24px 0;
            max-width: 450px;
            line-height: 1.5;
        }

        .btn {
            display: inline-block;
            margin-top: 10px;
            padding: 10px 22px;
            background: #F59E0B;
            color: #000;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            border-radius: 8px;
            transition: transform 0.2s, background 0.2s;
        }

        .btn:hover {
            background: #d97706;
            transform: scale(1.03);
        }
    </style>
</head>

<body>

    <!-- Studio Logo (From /Image folder) -->
    <img class="logo" src="Image/QuackworkStudios.png" alt="Quackwork Studios Logo">

    <div class="badge">✓ Email Verified</div>
    <h1>Verification Successful</h1>
    <p>Your account has been authenticated. You can now return to the game client and log in.</p>

    <a href="/" class="btn">Visit Website →</a>

    <!-- Game Title Image (From /Image folder) -->
    <img class="game-title" src="Image/TitleImageUpscale.png" alt="Duckmon Game Title">

</body>
</html>
